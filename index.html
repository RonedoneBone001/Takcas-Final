<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b12">
<title>Takcas Prime: Multi-Assistant</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--text:#e8edf7;--muted:#8e9ab0;--accent:#a78bfa;--line:rgba(160,174,205,.14)}
*{box-sizing:border-box}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(900px 500px at 12% -12%,rgba(124,91,230,.19),transparent 62%),radial-gradient(700px 420px at 100% 5%,rgba(44,116,190,.12),transparent 58%),var(--bg);color:var(--text);margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,textarea{font:inherit}button:focus-visible,textarea:focus-visible{outline:2px solid #c4b5fd;outline-offset:3px}
header{flex:0 0 auto;min-height:76px;padding:16px clamp(18px,4vw,54px);background:rgba(10,13,22,.82);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;justify-content:space-between;align-items:center;gap:18px;z-index:2}
h1{margin:0;color:#f4f1ff;font-size:clamp(19px,2.2vw,25px);font-weight:750;letter-spacing:-.045em}
h1:before{content:"";display:inline-block;width:9px;height:9px;margin:0 11px 3px 1px;border-radius:3px;background:linear-gradient(135deg,#c4b5fd,#7c3aed);box-shadow:0 0 18px rgba(167,139,250,.75);transform:rotate(45deg)}
.lang-btn{background:rgba(167,139,250,.09);border:1px solid rgba(167,139,250,.42);color:#d9ccff;padding:9px 15px;min-width:54px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:800;letter-spacing:.08em;transition:180ms ease}
.lang-btn:hover{background:rgba(167,139,250,.17);border-color:var(--accent);transform:translateY(-1px)}
.personas-bar{flex:0 0 auto;display:flex;gap:10px;padding:15px clamp(16px,4vw,54px);overflow-x:auto;background:rgba(12,15,24,.72);border-bottom:1px solid var(--line);scrollbar-width:thin;scrollbar-color:rgba(167,139,250,.35) transparent}
.persona-btn{flex:0 0 auto;background:rgba(255,255,255,.035);border:1px solid var(--line);color:#aeb9cc;padding:10px 16px;border-radius:13px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:650;transition:180ms ease}
.persona-btn:hover{color:#f2edff;border-color:rgba(167,139,250,.48);background:rgba(167,139,250,.08);transform:translateY(-1px)}
.persona-btn.active{color:#eee8ff;border-color:rgba(167,139,250,.72);background:linear-gradient(135deg,rgba(139,92,246,.23),rgba(99,102,241,.10));box-shadow:inset 0 0 0 1px rgba(196,181,253,.08),0 5px 20px rgba(91,61,180,.13)}
#chat-box{flex:1 1 auto;min-height:0;width:100%;padding:28px clamp(16px,8vw,120px);overflow-y:auto;display:flex;flex-direction:column;gap:19px;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(167,139,250,.3) transparent}
.message-wrapper{display:flex;flex-direction:column;max-width:min(82%,820px);position:relative}
.message{padding:14px 17px;border:1px solid var(--line);border-radius:18px;overflow-wrap:anywhere;line-height:1.68;font-size:14px;animation:fadeIn .24s ease;white-space:pre-wrap;box-shadow:0 7px 24px rgba(0,0,0,.12)}
@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.user-msg-wrapper{align-self:flex-end;align-items:flex-end}.bot-msg-wrapper{align-self:flex-start;align-items:flex-start}
.user-msg{color:#fff;background:linear-gradient(145deg,#6550c8,#49349f);border-color:rgba(196,181,253,.22);border-bottom-right-radius:6px}
.bot-msg{color:#e2e8f4;background:linear-gradient(145deg,rgba(24,31,48,.98),rgba(17,23,37,.98));border-color:rgba(148,163,184,.15);border-left:3px solid var(--accent);border-bottom-left-radius:6px}
.copy-btn{background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;font-size:11px;margin-top:6px;padding:5px 8px;border-radius:8px;opacity:.78;transition:180ms ease;display:flex;align-items:center;gap:5px}
.copy-btn:hover{opacity:1;color:#d9ccff;background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.2)}
.loading{display:flex;gap:5px;align-items:center;height:20px}.dot{width:7px;height:7px;background:#b9a5ff;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
.dot:nth-child(1){animation-delay:-.32s}.dot:nth-child(2){animation-delay:-.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0);opacity:.45}40%{transform:scale(1);opacity:1}}
.input-area{flex:0 0 auto;display:flex;align-items:flex-end;gap:11px;padding:16px clamp(16px,8vw,120px) max(16px,env(safe-area-inset-bottom));background:rgba(12,16,26,.92);border-top:1px solid var(--line);box-shadow:0 -14px 38px rgba(0,0,0,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
textarea{flex:1;min-width:0;padding:13px 16px;border-radius:14px;border:1px solid rgba(148,163,184,.2);background:rgba(7,10,18,.92);color:var(--text);font-size:14px;line-height:1.5;resize:none;height:46px;min-height:46px;max-height:120px;transition:180ms ease}
textarea::placeholder{color:#758198}textarea:focus{outline:none;border-color:rgba(167,139,250,.72);background:#0b0f1b;box-shadow:0 0 0 4px rgba(139,92,246,.12)}
.send-btn{flex:0 0 46px;width:46px;height:46px;display:grid;place-items:center;background:linear-gradient(145deg,#c4b5fd,#8b5cf6);color:#171025;border:1px solid rgba(221,214,254,.35);border-radius:14px;padding:0;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 7px 20px rgba(124,58,237,.24);transition:180ms ease}
.send-btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-2px)}.send-btn:disabled{cursor:wait;filter:saturate(.65);opacity:.7}
@media(min-width:1200px){#chat-box{padding-left:max(120px,calc((100vw - 1050px)/2));padding-right:max(120px,calc((100vw - 1050px)/2))}.input-area{padding-left:max(120px,calc((100vw - 1050px)/2));padding-right:max(120px,calc((100vw - 1050px)/2))}}
@media(max-width:640px){header{min-height:64px;padding:12px 16px}.personas-bar{gap:8px;padding:11px 13px}.persona-btn{padding:9px 12px;font-size:12px;border-radius:11px}#chat-box{padding:18px 13px;gap:14px}.message-wrapper{max-width:94%}.message{padding:12px 14px;font-size:13px;border-radius:15px}.input-area{gap:8px;padding:11px 12px max(12px,env(safe-area-inset-bottom))}textarea{height:44px;min-height:44px;padding:11px 13px}.send-btn{flex-basis:44px;width:44px;height:44px;border-radius:13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
    <h1>Takcas Prime</h1>
    <button class="lang-btn" id="lang-toggle" type="button">EN</button>
</header>

<nav class="personas-bar" id="personas-bar" aria-label="Assistants">
    <button class="persona-btn active" data-persona="taksas" id="btn-taksas" type="button">🕵️‍♂️ Таксас</button>
    <button class="persona-btn" data-persona="dubina" id="btn-dubina" type="button">🪵 Дубина</button>
    <button class="persona-btn" data-persona="prokrastinator" id="btn-prokrastinator" type="button">🦥 Прокрастинатор</button>
    <button class="persona-btn" data-persona="potassium" id="btn-potassium" type="button">🥔 Потассиум</button>
    <button class="persona-btn" data-persona="coder" id="btn-coder" type="button">💻 Кодер</button>
</nav>

<main id="chat-box" aria-live="polite"></main>

<div class="input-area">
    <textarea id="user-input" placeholder="Напиши сообщение..." rows="1" aria-label="Message"></textarea>
    <button class="send-btn" id="send-btn" type="button" aria-label="Send message">➤</button>
</div>

<script>
"use strict";

const chatBox = document.getElementById("chat-box");
const input = document.getElementById("user-input");
const personasBar = document.getElementById("personas-bar");
const sendButton = document.getElementById("send-btn");
const langButton = document.getElementById("lang-toggle");

const PERSONAS = ["taksas","dubina","prokrastinator","potassium","coder"];
const MAX_HISTORY = 50;
const REQUEST_TIMEOUT = 120000;

let currentPersona = "taksas";
let currentLang = "ru";
let isSending = false;

const translations = {
    ru: {
        placeholder:"Напиши сообщение...",taksas:"🕵️‍♂️ Таксас",dubina:"🪵 Дубина",
        prokrastinator:"🦥 Прокрастинатор",potassium:"🥔 Потассиум",coder:"💻 Кодер",
        copy:"Копировать",copied:"Скопировано!",copyError:"Не удалось скопировать",
        connection:"Ошибка соединения.",generic:"Не удалось получить ответ.",
        timeout:"Время ожидания ответа истекло.",invalidJson:"Сервер вернул некорректный JSON.",
        serverError:"Ошибка сервера",send:"Отправить сообщение"
    },
    en: {
        placeholder:"Type a message...",taksas:"🕵️‍♂️ Takcas",dubina:"🪵 Dubina",
        prokrastinator:"🦥 Procrastinator",potassium:"🥔 Potassium",coder:"💻 Coder",
        copy:"Copy",copied:"Copied!",copyError:"Could not copy",
        connection:"Connection error.",generic:"Could not get a response.",
        timeout:"Request timed out.",invalidJson:"Server returned invalid JSON.",
        serverError:"Server error",send:"Send message"
    }
};

function toggleLang() {
    currentLang = currentLang === "ru" ? "en" : "ru";
    langButton.textContent = currentLang === "ru" ? "EN" : "RU";
    input.placeholder = translations[currentLang].placeholder;
    input.setAttribute("aria-label", translations[currentLang].placeholder);
    sendButton.setAttribute("aria-label", translations[currentLang].send);

    PERSONAS.forEach(persona => {
        const button = document.getElementById(`btn-${persona}`);
        if (button) button.textContent = translations[currentLang][persona];
    });

    renderHistory();
}

function getHistoryKey(persona = currentPersona) {
    return `chat_history_${persona}`;
}

function normalizeHistory(data) {
    if (!Array.isArray(data)) return [];

    return data.filter(msg =>
        msg &&
        typeof msg === "object" &&
        ["user","assistant"].includes(msg.role) &&
        typeof msg.content === "string"
    ).slice(-MAX_HISTORY);
}

function loadHistory(persona = currentPersona) {
    try {
        const raw = localStorage.getItem(getHistoryKey(persona));
        if (!raw) return [];
        return normalizeHistory(JSON.parse(raw));
    } catch (error) {
        console.warn("History loading error:", error);
        return [];
    }
}

function saveHistory(history, persona = currentPersona) {
    try {
        if (!PERSONAS.includes(persona)) return;
        localStorage.setItem(
            getHistoryKey(persona),
            JSON.stringify(normalizeHistory(history))
        );
    } catch (error) {
        console.warn("History saving error:", error);
    }
}

function renderHistory() {
    chatBox.replaceChildren();

    loadHistory(currentPersona).forEach(msg => {
        addMessageToUI(msg.content, msg.role === "user" ? "user" : "bot", false);
    });

    scrollToBottom();
}

personasBar.addEventListener("click", event => {
    const button = event.target.closest(".persona-btn");
    if (!button || !personasBar.contains(button)) return;

    const persona = button.dataset.persona;
    if (!PERSONAS.includes(persona)) return;

    currentPersona = persona;

    document.querySelectorAll(".persona-btn").forEach(btn => {
        btn.classList.toggle("active", btn === button);
    });

    renderHistory();
});

function addMessageToUI(text, sender, animate = true) {
    const wrapper = document.createElement("div");
    wrapper.className = `message-wrapper ${sender === "user" ? "user-msg-wrapper" : "bot-msg-wrapper"}`;

    const message = document.createElement("div");
    message.className = `message ${sender === "user" ? "user-msg" : "bot-msg"}`;
    if (!animate) message.style.animation = "none";
    message.textContent = text;
    wrapper.appendChild(message);

    if (sender === "bot") {
        const copyButton = document.createElement("button");
        copyButton.className = "copy-btn";
        copyButton.type = "button";
        copyButton.textContent = "📋 " + translations[currentLang].copy;

        copyButton.addEventListener("click", async () => {
            const success = await copyText(text);
            copyButton.textContent = success
                ? "✅ " + translations[currentLang].copied
                : "❌ " + translations[currentLang].copyError;
        });

        wrapper.appendChild(copyButton);
    }

    chatBox.appendChild(wrapper);
    scrollToBottom();
    return wrapper;
}

async function copyText(text) {
    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
        }

        const temporary = document.createElement("textarea");
        temporary.value = text;
        temporary.style.position = "fixed";
        temporary.style.opacity = "0";
        document.body.appendChild(temporary);
        temporary.select();

        const success = document.execCommand("copy");
        temporary.remove();
        return success;
    } catch (error) {
        console.warn("Clipboard error:", error);
        return false;
    }
}

function createLoadingIndicator() {
    const wrapper = document.createElement("div");
    wrapper.className = "message-wrapper bot-msg-wrapper";

    const message = document.createElement("div");
    message.className = "message bot-msg";

    const loading = document.createElement("div");
    loading.className = "loading";

    for (let i = 0; i < 3; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        loading.appendChild(dot);
    }

    message.appendChild(loading);
    wrapper.appendChild(message);
    return wrapper;
}

function scrollToBottom() {
    chatBox.scrollTop = chatBox.scrollHeight;
}

function resizeInput() {
    input.style.height = "46px";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
}

input.addEventListener("input", resizeInput);

function setSending(state) {
    isSending = state;
    sendButton.disabled = state;
    input.disabled = state;
}

async function sendMessage() {
    if (isSending) return;

    const message = input.value.trim();
    if (!message) return;

    const persona = currentPersona;
    const lang = currentLang;
    const history = loadHistory(persona);

    history.push({role:"user",content:message});
    saveHistory(history, persona);
    addMessageToUI(message, "user");

    input.value = "";
    resizeInput();
    setSending(true);

    const loadingWrapper = createLoadingIndicator();
    chatBox.appendChild(loadingWrapper);
    scrollToBottom();

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);

    try {
        const response = await fetch("/chat", {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Accept":"application/json"
            },
            body:JSON.stringify({
                persona:persona,
                message:message,
                history:history,
                lang:lang
            }),
            signal:controller.signal
        });

        let data;
        try {
            data = await response.json();
        } catch {
            throw new Error(translations[lang].invalidJson);
        }

        if (!response.ok) {
            throw new Error(
                data?.error ||
                `${translations[lang].serverError} (${response.status})`
            );
        }

        if (!data || typeof data.response !== "string" || !data.response.trim()) {
            throw new Error(data?.error || translations[lang].generic);
        }

        const botResponse = data.response.trim();
        const updatedHistory = loadHistory(persona);

        updatedHistory.push({
            role:"assistant",
            content:botResponse
        });

        saveHistory(updatedHistory, persona);

        if (currentPersona === persona) {
            addMessageToUI(botResponse, "bot");
        }

    } catch (error) {
        const errorMessage = error.name === "AbortError"
            ? translations[lang].timeout
            : error.message || translations[lang].connection;

        console.error("Chat request error:", error);

        if (currentPersona === persona) {
            addMessageToUI("Error: " + errorMessage, "bot");
        }

    } finally {
        clearTimeout(timeoutId);
        loadingWrapper.remove();
        setSending(false);
        input.focus();
    }
}

sendButton.addEventListener("click", sendMessage);
langButton.addEventListener("click", toggleLang);

input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        sendMessage();
    }
});

function initialize() {
    renderHistory();
    input.focus();
}

initialize();
</script>
</body>
</html>
