<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takcas Coder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">T</div>
      <div>
        <div class="brand-title">Takcas Coder</div>
        <div class="brand-sub">AI Workspace</div>
      </div>
    </div>

    <button class="nav-item active">
      <span>Takcas Coder</span><span class="tag">AI</span>
    </button>

    <div class="section-label">WORKSPACE</div>
    <button id="newChat" class="nav-item">✦ New chat</button>
    <button class="nav-item" id="historyBtn">🕘 History</button>
    <button class="nav-item">📁 Projects <span class="tag new">NEW</span></button>
    <button class="nav-item" id="modelsBtn">🧠 AI models</button>

    <div class="section-label">RECENT</div>
    <div class="history" id="history"></div>

    <div class="sidebar-footer">
      <button class="nav-item">⚙ Settings</button>
      <div class="profile">
        <div class="avatar">T</div>
        <div class="profile-info">
          <div class="profile-name">Takcas User</div>
          <div class="profile-sub">Local workspace</div>
        </div>
        <span class="gear">⚙</span>
      </div>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <div class="header-left">
        <span class="chat-title" id="chatTitle">Takcas Coder</span>
        <span class="status"><span class="dot"></span>Ready</span>
      </div>
      <div class="header-right">
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="ru">RU</button>
        </div>
        <button class="icon-btn" id="themeToggle" title="Тема">☀</button>
        <button class="icon-btn" id="clearChat" title="Очистить">🗑</button>
      </div>
    </header>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="composer">
        <div class="composer-top">
          <button class="chip" id="codeMode">&lt;/&gt; Code</button>
          <button class="chip" id="attachBtn">📎 Attach</button>
        </div>
        <textarea id="input" rows="1" placeholder="Message Takcas Coder..."></textarea>
        <button class="send-btn" id="sendBtn">↑</button>
      </div>
      <div class="disclaimer">AI can make mistakes. Review important code before using it.</div>
    </div>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
