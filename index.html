<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takcas Prime: Multi-Assistant</title>
    <style>
        :root { --bg-color: #0f0f13; --panel-bg: #1e1e24; --text-color: #e0e0e0; --accent: #bb86fc; --user-bg: #3700b3; --bot-bg: #2e2e2e; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: var(--panel-bg); padding: 15px; text-align: center; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        h1 { margin: 0; color: var(--accent); font-size: 24px; letter-spacing: 1px; }
        .lang-btn { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .personas-bar { display: flex; gap: 10px; padding: 15px; overflow-x: auto; background-color: var(--bg-color); border-bottom: 1px solid #333; }
        .persona-btn { background-color: var(--panel-bg); border: 2px solid transparent; color: var(--text-color); padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: all 0.2s; white-space: nowrap; font-weight: bold; }
        .persona-btn.active { border-color: var(--accent); background-color: rgba(187, 134, 252, 0.1); color: var(--accent); }
        .persona-btn:hover { border-color: #555; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 85%; word-wrap: break-word; line-height: 1.5; font-size: 15px; animation: fadeIn 0.3s ease; white-space: pre-wrap; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .user-msg { background-color: var(--user-bg); align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background-color: var(--bot-bg); align-self: flex-start; border-bottom-left-radius: 2px; border-left: 3px solid var(--accent); }
        .copy-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 12px; margin-top: 5px; padding: 2px 5px; display: flex; align-items: center; gap: 4px; }
        .copy-btn:hover { color: var(--accent); }
        .loading { display: flex; gap: 4px; align-items: center; height: 20px; }
        .dot { width: 8px; height: 8px; background-color: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; } .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .input-area { padding: 15px; background-color: var(--panel-bg); display: flex; gap: 10px; border-top: 1px solid #333; }
        textarea { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: var(--bg-color); color: var(--text-color); font-size: 15px; resize: none; height: 20px; max-height: 100px; transition: height 0.2s; }
        textarea:focus { outline: none; border-color: var(--accent); }
        button.send-btn { background-color: var(--accent); color: #000; border: none; border-radius: 8px; padding: 0 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button.send-btn:hover { background-color: #9965d8; }
        button.send-btn:disabled { opacity: 0.6; cursor: wait; }
    </style>
</head>
<body>
    <header>
        <h1>Takcas Prime</h1>
        <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">EN</button>
    </header>
    
    <div class="personas-bar" id="personas-bar">
        <button class="persona-btn active" data-persona="taksas" id="btn-taksas">🕵️‍♂️ Таксас</button>
        <button class="persona-btn" data-persona="dubina" id="btn-dubina">🪵 Дубина</button>
        <button class="persona-btn" data-persona="prokrastinator" id="btn-prokrastinator">🦥 Прокрастинатор</button>
        <button class="persona-btn" data-persona="potassium" id="btn-potassium">🥔 Потассиум</button>
        <button class="persona-btn" data-persona="coder" id="btn-coder">💻 Кодер</button>
    </div>
    
    <div id="chat-box"></div>
    
    <div class="input-area">
        <textarea id="user-input" placeholder="Напиши сообщение..." rows="1"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        "use strict";

        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');
        const personasBar = document.getElementById('personas-bar');
        const sendButton = document.getElementById('send-btn');
        const langButton = document.getElementById('lang-toggle');

        const PERSONAS = ["taksas", "dubina", "prokrastinator", "potassium", "coder"];
        const MAX_HISTORY = 50;
        const REQUEST_TIMEOUT = 120000;

        let currentPersona = 'taksas';
        let currentLang = 'ru';
        let isSending = false;

        const translations = {
            ru: { placeholder: "Напиши сообщение...", taksas: "🕵️‍♂️ Таксас", dubina: "🪵 Дубина", prokrastinator: "🦥 Прокрастинатор", potassium: "🥔 Потассиум", coder: "💻 Кодер", copy: "Копировать", copied: "Скопировано!", copyError: "Не удалось скопировать", connection: "Ошибка соединения.", generic: "Не удалось получить ответ.", timeout: "Время ожидания истекло." },
            en: { placeholder: "Type a message...", taksas: "🕵️‍♂️ Takcas", dubina: "🪵 Dubina", prokrastinator: "🦥 Procrastinator", potassium: "🥔 Potassium", coder: "💻 Coder", copy: "Copy", copied: "Copied!", copyError: "Could not copy", connection: "Connection error.", generic: "Could not get a response.", timeout: "Request timed out." }
        };

        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            langButton.innerText = currentLang === 'ru' ? 'EN' : 'RU';
            input.placeholder = translations[currentLang].placeholder;
            PERSONAS.forEach(p => {
                const btn = document.getElementById(`btn-${p}`);
                if (btn) btn.innerText = translations[currentLang][p];
            });
            renderHistory();
        }

        function getHistoryKey(persona = currentPersona) { return `chat_history_${persona}`; }

        function normalizeHistory(data) {
            if (!Array.isArray(data)) return [];
            return data.filter(msg => 
                msg && typeof msg === 'object' && 
                ["user", "assistant"].includes(msg.role) && 
                typeof msg.content === 'string'
            ).slice(-MAX_HISTORY);
        }

        function loadHistory(persona = currentPersona) {
            try {
                const raw = localStorage.getItem(getHistoryKey(persona));
                return raw ? normalizeHistory(JSON.parse(raw)) : [];
            } catch { return []; }
        }

        function saveHistory(history, persona = currentPersona) {
            try {
                if (PERSONAS.includes(persona)) {
                    localStorage.setItem(getHistoryKey(persona), JSON.stringify(normalizeHistory(history)));
                }
            } catch {}
        }

        function renderHistory() {
            chatBox.replaceChildren();
            loadHistory(currentPersona).forEach(msg => addMessageToUI(msg.content, msg.role === 'user' ? 'user' : 'bot', false));
        }

        personasBar.addEventListener('click', (e) => {
            const btn = e.target.closest('.persona-btn');
            if (!btn || !PERSONAS.includes(btn.dataset.persona)) return;
            document.querySelectorAll('.persona-btn').forEach(b => b.classList.toggle('active', b === btn));
            currentPersona = btn.dataset.persona;
            renderHistory();
        });

        input.addEventListener('input', function() {
            this.style.height = '20px';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        function addMessageToUI(text, sender, animate = true) {
            const wrapper = document.createElement('div');
            wrapper.className = `message ${sender === 'user' ? 'user-msg' : 'bot-msg'}`;
            if (!animate) wrapper.style.animation = 'none';
            wrapper.textContent = text; // Безопасно от XSS
            chatBox.appendChild(wrapper);

            if (sender === 'bot') {
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = '📋 ' + translations[currentLang].copy;
                copyBtn.onclick = async () => {
                    try {
                        if (navigator.clipboard && window.isSecureContext) {
                            await navigator.clipboard.writeText(text);
                            copyBtn.textContent = '✅ ' + translations[currentLang].copied;
                        } else {
                            throw new Error('Clipboard not available');
                        }
                    } catch {
                        copyBtn.textContent = '❌ ' + translations[currentLang].copyError;
                    }
                };
                chatBox.appendChild(copyBtn);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setSending(state) {
            isSending = state;
            sendButton.disabled = state;
            input.disabled = state;
        }

        async function sendMessage() {
            if (isSending) return;
            const text = input.value.trim();
            if (!text) return;

            const persona = currentPersona;
            const lang = currentLang;
            const history = loadHistory(persona);
            history.push({ role: 'user', content: text });
            saveHistory(history, persona);
            addMessageToUI(text, 'user');

            input.value = '';
            input.style.height = '20px';
            setSending(true);

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot-msg';
            loadingDiv.innerHTML = '<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ persona, message: text, history, lang }),
                    signal: controller.signal
                });
                
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || `Server error (${response.status})`);
                if (typeof data.response !== 'string' || !data.response.trim()) throw new Error(data.error || translations[lang].generic);

                const updated = loadHistory(persona);
                updated.push({ role: 'assistant', content: data.response.trim() });
                saveHistory(updated, persona);

                if (currentPersona === persona) addMessageToUI(data.response.trim(), 'bot');

            } catch (error) {
                const msg = error.name === 'AbortError' ? translations[lang].timeout : (error.message || translations[lang].connection);
                if (currentPersona === persona) addMessageToUI('Error: ' + msg, 'bot');
            } finally {
                clearTimeout(timeoutId);
                loadingDiv.remove();
                setSending(false);
                input.focus();
            }
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                sendMessage();
            }
        });

        renderHistory();
    </script>
</body>
</html>
