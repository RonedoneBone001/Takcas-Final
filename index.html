<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takcas Prime: Multi-Assistant</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-color: #090b12;
            --text-color: #e8edf7;
            --muted: #8e9ab0;
            --accent: #a78bfa;
            --accent-strong: #8b5cf6;
            --user-bg: #5140a8;
            --bot-bg: #151b2a;
            --line: rgba(160, 174, 205, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(900px 500px at 12% -12%, rgba(124, 91, 230, 0.19), transparent 62%),
                        radial-gradient(700px 420px at 100% 5%, rgba(44, 116, 190, 0.12), transparent 58%),
                        var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            flex: 0 0 auto;
            min-height: 64px;
            padding: 16px clamp(18px, 4vw, 54px);
            background: rgba(10, 13, 22, 0.82);
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            color: #f4f1ff;
            font-size: 22px;
            font-weight: 750;
        }

        .lang-btn {
            background: rgba(167, 139, 250, 0.09);
            border: 1px solid rgba(167, 139, 250, 0.42);
            color: #d9ccff;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
        }

        .personas-bar {
            flex: 0 0 auto;
            display: flex;
            gap: 10px;
            padding: 14px clamp(16px, 4vw, 54px);
            overflow-x: auto;
            background: rgba(12, 15, 24, 0.72);
            border-bottom: 1px solid var(--line);
        }

        .persona-btn {
            flex: 0 0 auto;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid var(--line);
            color: #aeb9cc;
            padding: 9px 15px;
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 650;
        }

        .persona-btn.active {
            color: #eee8ff;
            border-color: rgba(167, 139, 250, 0.72);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.23), rgba(99, 102, 241, 0.10));
        }

        #chat-box {
            flex: 1 1 auto;
            min-height: 0;
            padding: 24px clamp(16px, 8vw, 120px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: min(82%, 820px);
        }

        .message {
            padding: 13px 16px;
            border: 1px solid var(--line);
            border-radius: 16px;
            word-wrap: break-word;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg-wrapper { align-self: flex-end; align-items: flex-end; }
        .bot-msg-wrapper { align-self: flex-start; align-items: flex-start; }

        .user-msg {
            color: #fff;
            background: linear-gradient(145deg, #6550c8, #49349f);
            border-bottom-right-radius: 4px;
        }

        .bot-msg {
            color: #e2e8f4;
            background: linear-gradient(145deg, rgba(24, 31, 48, 0.98), rgba(17, 23, 37, 0.98));
            border-left: 3px solid var(--accent);
            border-bottom-left-radius: 4px;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 11px;
            margin-top: 5px;
            padding: 4px 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .loading { display: flex; gap: 4px; align-items: center; height: 20px; }
        .dot {
            width: 7px;
            height: 7px;
            background: #b9a5ff;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            flex: 0 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 14px clamp(16px, 8vw, 120px) max(14px, env(safe-area-inset-bottom));
            background: rgba(12, 16, 26, 0.92);
            border-top: 1px solid var(--line);
        }

        textarea {
            flex: 1;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(7, 10, 18, 0.92);
            color: var(--text-color);
            font-size: 14px;
            resize: none;
            height: 44px;
            max-height: 120px;
        }

        textarea:focus {
            outline: none;
            border-color: rgba(167, 139, 250, 0.72);
        }

        button.send-btn {
            flex: 0 0 44px;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #c4b5fd, #8b5cf6);
            color: #171025;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Takcas Prime</h1>
        <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">EN</button>
    </header>

    <div class="personas-bar" id="personas-bar">
        <button class="persona-btn active" data-persona="taksas" id="btn-taksas">🕵️‍♂️ Таксас</button>
        <button class="persona-btn" data-persona="dubina" id="btn-dubina">🪵 Дубина</button>
        <button class="persona-btn" data-persona="prokrastinator" id="btn-prokrastinator">🦥 Прокрастинатор</button>
        <button class="persona-btn" data-persona="potassium" id="btn-potassium">🥔 Потассиум</button>
        <button class="persona-btn" data-persona="coder" id="btn-coder">💻 Кодер</button>
    </div>

    <div id="chat-box"></div>

    <div class="input-area">
        <textarea id="user-input" placeholder="Напиши сообщение..." rows="1"></textarea>
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');
        const personasBar = document.getElementById('personas-bar');
        const sendButton = document.querySelector('.send-btn');
        let currentPersona = 'taksas';
        let currentLang = 'ru';
        let isSending = false;

        const translations = {
            ru: { placeholder: "Напиши сообщение...", taksas: "🕵️‍♂️ Таксас", dubina: "🪵 Дубина", prokrastinator: "🦥 Прокрастинатор", potassium: "🥔 Потассиум", coder: "💻 Кодер", copy: "Копировать", copied: "Скопировано!", connection: "Ошибка соединения.", generic: "Не удалось получить ответ." },
            en: { placeholder: "Type a message...", taksas: "🕵️‍♂️ Takcas", dubina: "🪵 Dubina", prokrastinator: "🦥 Procrastinator", potassium: "🥔 Potassium", coder: "💻 Coder", copy: "Copy", copied: "Copied!", connection: "Connection error.", generic: "Could not get a response." }
        };

        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('lang-toggle').innerText = currentLang === 'ru' ? 'EN' : 'RU';
            input.placeholder = translations[currentLang].placeholder;
            document.getElementById('btn-taksas').innerText = translations[currentLang].taksas;
            document.getElementById('btn-dubina').innerText = translations[currentLang].dubina;
            document.getElementById('btn-prokrastinator').innerText = translations[currentLang].prokrastinator;
            document.getElementById('btn-potassium').innerText = translations[currentLang].potassium;
            document.getElementById('btn-coder').innerText = translations[currentLang].coder;
            renderHistory();
        }

        function getHistoryKey() { return `chat_history_${currentPersona}`; }
        
        function loadHistory() {
            try { return JSON.parse(localStorage.getItem(getHistoryKey())) || []; }
            catch { return []; }
        }

        function saveHistory(history) {
            try { localStorage.setItem(getHistoryKey(), JSON.stringify(history.slice(-50))); }
            catch {}
        }

        function renderHistory() {
            chatBox.innerHTML = '';
            loadHistory().forEach(msg => addMessageToUI(msg.content, msg.role === 'user' ? 'user' : 'bot', false));
        }

        personasBar.addEventListener('click', (e) => {
            const btn = e.target.closest('.persona-btn');
            if (!btn) return;
            document.querySelectorAll('.persona-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPersona = btn.dataset.persona;
            renderHistory();
        });

        input.addEventListener('input', function() {
            this.style.height = '44px';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        function addMessageToUI(text, sender, animate = true) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender === 'user' ? 'user-msg-wrapper' : 'bot-msg-wrapper'}`;
            const div = document.createElement('div');
            div.className = `message ${sender === 'user' ? 'user-msg' : 'bot-msg'}`;
            if (!animate) div.style.animation = 'none';
            div.innerText = text;
            wrapper.appendChild(div);

            if (sender === 'bot') {
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerText = '📋 ' + translations[currentLang].copy;
                copyBtn.onclick = async () => {
                    try {
                        await navigator.clipboard.writeText(text);
                        copyBtn.innerText = '✅ ' + translations[currentLang].copied;
                    } catch { copyBtn.innerText = translations[currentLang].copy; }
                };
                wrapper.appendChild(copyBtn);
            }
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setSending(s) {
            isSending = s;
            sendButton.disabled = s;
            input.disabled = s;
        }

        async function sendMessage() {
            if (isSending) return;
            const text = input.value.trim();
            if (!text) return;

            const persona = currentPersona;
            const lang = currentLang;
            const history = loadHistory();
            history.push({ role: 'user', content: text });
            saveHistory(history);
            addMessageToUI(text, 'user');

            input.value = '';
            input.style.height = '44px';
            setSending(true);

            const loadingWrapper = document.createElement('div');
            loadingWrapper.className = 'message-wrapper bot-msg-wrapper';
            loadingWrapper.innerHTML = '<div class="message bot-msg"><div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
            chatBox.appendChild(loadingWrapper);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ persona, message: text, history, lang })
                });
                const data = await response.json().catch(() => ({}));

                if (!response.ok) throw new Error(data.error || `Request failed (${response.status}).`);
                if (typeof data.response !== 'string' || !data.response.trim()) throw new Error(data.error || translations[lang].generic);

                const updated = loadHistory();
                updated.push({ role: 'assistant', content: data.response.trim() });
                saveHistory(updated);

                if (currentPersona === persona) addMessageToUI(data.response.trim(), 'bot');
            } catch (error) {
                const msg = error.message || translations[lang].connection;
                if (currentPersona === persona) addMessageToUI('Error: ' + msg, 'bot');
            } finally {
                loadingWrapper.remove();
                setSending(false);
                input.focus();
            }
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        renderHistory();
    </script>
</body>
</html>
