<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09070f">
<title>Takcas Prime — AI Workspace</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">T</div>
      <div><div class="brand-name">Takcas Prime</div><div class="brand-sub">AI Workspace</div></div>
    </div>
    <div class="sidebar-label">ПЕРСОНАЖИ</div>
    <nav class="nav">
      <button class="nav-btn active" data-persona="taksas" id="btn-taksas">🕵️‍♂️ Таксас</button>
      <button class="nav-btn" data-persona="dubina" id="btn-dubina">🪵 Дубина</button>
      <button class="nav-btn" data-persona="prokrastinator" id="btn-prokrastinator">🦥 Прокрастинатор</button>
      <button class="nav-btn" data-persona="potassium" id="btn-potassium">🥔 Потассиум</button>
      <button class="nav-btn" data-persona="coder" id="btn-coder">💻 Кодер</button>
    </nav>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn" id="sidebar-open">☰</button>
        <div class="page-title">Takcas Prime</div>
        <div class="status"><span class="status-dot"></span>Ready</div>
      </div>
      <div class="top-actions">
        <button class="lang-btn" id="lang-toggle">EN / RU</button>
        <button class="icon-btn" id="clear-chat">🗑</button>
      </div>
    </header>
    <section class="workspace" id="workspace">
      <div class="chat-page">
        <div class="messages" id="chat-box"></div>
      </div>
    </section>
    <footer class="composer-area">
      <div class="composer">
        <textarea id="user-input" rows="2" placeholder="Сообщение..."></textarea>
        <div class="composer-bottom">
          <button class="send-btn" id="send-btn" disabled>➤</button>
        </div>
      </div>
    </footer>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
