<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takcas Coder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">T</div>
      <div>
        <div class="brand-title">Takcas Coder</div>
        <div class="brand-sub">AI Workspace</div>
      </div>
    </div>

    <button class="nav-item active">
      <span>Takcas Coder</span><span class="tag">AI</span>
    </button>

    <div class="section-label">WORKSPACE</div>
    <button id="newChat" class="nav-item">✦ <span data-i18n="newChat">New chat</span></button>
    <button class="nav-item"><span data-i18n="history">History</span></button>
    <button class="nav-item"><span data-i18n="projects">Projects</span> <span class="tag new">NEW</span></button>
    <button class="nav-item" id="modelsBtn">🧠 <span id="modelsName">Таксас</span></button>

    <div class="section-label">RECENT</div>
    <div class="history" id="history"></div>

    <div class="sidebar-footer">
      <button class="nav-item">⚙ <span data-i18n="settings">Settings</span></button>
      <div class="profile">
        <div class="avatar">T</div>
        <div class="profile-info">
          <div class="profile-name">Takcas User</div>
          <div class="profile-sub" data-i18n="local">Local workspace</div>
        </div>
        <span class="gear">⚙</span>
      </div>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <div class="header-left">
        <span class="chat-title" id="chatTitle">Таксас</span>
        <span class="status"><span class="dot"></span><span data-i18n="ready">Ready</span></span>
      </div>
      <div class="header-right">
        <div class="lang-switch">
          <button class="lang-btn" data-lang="en">EN</button>
          <button class="lang-btn active" data-lang="ru">RU</button>
        </div>
        <button class="icon-btn" id="themeToggle" title="Theme">☀</button>
        <button class="icon-btn" id="clearChat" title="Clear">🗑</button>
      </div>
    </header>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="composer">
        <div class="composer-top">
          <button class="chip" id="codeMode">&lt;/&gt; <span data-i18n="code">Code</span></button>
          <button class="chip" id="attachBtn">📎 <span data-i18n="attach">Attach</span></button>
        </div>
        <textarea id="input" rows="1" placeholder="Message Takcas Coder..."></textarea>
        <button class="send-btn" id="sendBtn" title="Send">↑</button>
      </div>
      <div class="disclaimer" data-i18n="disclaimer">AI can make mistakes. Review important code before using it.</div>
    </div>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
